[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "pinn"
version = "0.1.0"
description = "PINN project for DTU deep learning course."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.2.0",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "timm>=1.0.30",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.1",
]